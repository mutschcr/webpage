abstract = "We show a channel charting architecture that can natively handle variable numbers of CSI measurements and arbitrary antenna subsets. Across two public real-world SISO and MIMO datasets, AdaPos maintains state-of-the-art localization accuracy under missing-antenna conditions, replaces roughly 57 configuration-specific models with a single unified model, and provides resilience to both individual antenna failures and full-array outages."
