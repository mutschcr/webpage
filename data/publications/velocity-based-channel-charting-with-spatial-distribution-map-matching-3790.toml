title = "Velocity-based Channel Charting with Spatial Distribution Map Matching"
authors = ["Maximilian Stahlke", "George Yammine", "Tobias Feigl", "Bjoern M Eskofier", "Christopher Mutschler"]
date = "2024-01-01"
venue = "IEEE Journal of Indoor and Seamless Positioning and Navigation (J-ISPIN)"
detail_url = "/publication/velocity-based-channel-charting-with-spatial-distribution-map-matching/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/JISPIN.2024.3424768"
abstract = "We propose a novel channel charting framework that does not require references and dramatically reduces life-cycle management. With velocity information, e.g., pedestrian dead reckoning or odometry, we model relative charts. And with topological map information, e.g., building floor plans, we transform them into real coordinates. In a large-scale study, we acquired two realistic datasets using 5G and single-input and multiple-output distributed radio systems with noisy velocities and coarse map information. Our experiments show that we achieve the localization accuracy of FP but without reference information."
