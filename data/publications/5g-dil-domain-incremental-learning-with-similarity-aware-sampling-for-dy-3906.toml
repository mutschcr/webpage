title = "5G-DIL: Domain Incremental Learning with Similarity-Aware Sampling for Dynamic 5G Indoor Localization"
authors = ["Nisha Lakshmana Raichur", "Lucas Heublein", "Christopher Mutschler", "Felix Ott"]
date = "2025-01-01"
venue = "International Conference on Localization and GNSS (ICL-GNSS)"
detail_url = "/publication/5g-dil-domain-incremental-learning-with-similarity-aware-sampling-for-dynamic-5g-indoor-localization/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/ICL-GNSS65520.2025.11046094"
abstract = '''
This paper introduces a domain incremental learning (DIL) approach for dynamic 5G indoor localization, called 5GDIL, enabling rapid adaptation to environmental changes. We present a novel similarity-aware sampling technique based on the Chebyshev distance, designed to efficiently select specific exemplars from the previous environment while training only on the modified regions of the new environment. This avoids the need to train on the entire region, significantly reducing the time and resources required for adaptation without compromising localization accuracy. This approach requires as few as 50 exemplars from adaptation domains, significantly reducing training time while maintaining high positioning accuracy in previous environments. Comparative evaluations against state-of-the-art DIL techniques on a challenging real-world indoor dataset demonstrate the effectiveness of the proposed sample selection method. Our approach is adaptable to real-world non-line-ofsight propagation scenarios and achieves an MAE positioning error of 0.261 meters, even under dynamic environmental conditions.

Code: https://gitlab.cc-asp.fraunhofer.de/5g-pos/5g-dil'''
