title = "Unsupervised Learning of Variational Autoencoders on Cortex-M Microcontrollers"
authors = ["Mark Deutel", "Axel Plinge", "Dominik Seuß", "Christopher Mutschler", "Frank Hannig", "Jürgen Teich"]
date = "2025-09-20"
venue = "18th IEEE International Symposium on Embedded Multicore/Many-core Systems-on-Chip (MCSoC)"
detail_url = "/publication/unsupervised-learning-of-variational-autoencoders-on-cortex-m-microcontrollers/"
profiles = ["mark-deutel", "christopher-mutschler"]
doi = "https://doi.org/10.1109/MCSoC67473.2025.00079"
abstract = "We explore variational autoencoders as a way to train unsupervised, i.e., without labels, feature extractors for image classification on a Cortex-M MCU. Using these feature extractors, we then train classification heads using small labeled representative sets of data to solve classification tasks. Our approach significantly reduces the amount of labeled data required, while enabling full DNN training from scratch on resource-constrained devices."
