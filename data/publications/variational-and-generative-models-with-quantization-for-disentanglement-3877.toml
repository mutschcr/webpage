title = "Variational and Generative Models with Quantization for Disentanglement and Compressed Sensing of GNSS Spectrograms"
authors = ["Lucas Heublein", "Tobias Feigl", "Alexander Rügamer", "Christopher Mutschler", "Felix Ott"]
date = "2026-01-01"
venue = "IEEE Journal of Indoor and Seamless Positioning and Navigation"
detail_url = "/publication/variational-and-generative-models-with-quantization-for-disentanglement-and-compressed-sensing-of-gnss-spectrograms/"
profiles = []
doi = "https://doi.org/10.1109/JISPIN.2026.3655630"
abstract = "We propose variational autoencoders (VAEs) for disentanglement to extract essential latent features that enable accurate classification of interferences. We demonstrate that the disentanglement approach can be leveraged for both data compression and data augmentation by interpolating the lower-dimensional latent representations of signal power. To validate our approach, we evaluate three VAE variants—vanilla, factorized, and conditional generative—and benchmark 19 state-of-the-art VAE and generative models on five distinct datasets, including three collected in controlled indoor environments and two real-world highway datasets. In addition, we conduct extensive hyperparameter searches to optimize performance. Our proposed VAE achieves a data compression rate ranging from 512 to 8192 and achieves an accuracy up to 99.92%. Quantizing our model from float32 to int8 results in a fourfold reduction in model weight size."
