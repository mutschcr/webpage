title = "SafeMPO: Constrained Reinforcement Learning with Probabilistic Incremental Improvement"
authors = ["Alexander Mattick", "Dominik Seuß", "Christopher Mutschler"]
date = "2026-09-19"
venue = "14th International Conference on Learning Representations (ICLR)"
detail_url = "/publication/safempo-constrained-reinforcement-learning-with-probabilistic-incremental-improvement/"
profiles = ["alexander-mattick", "christopher-mutschler"]
pdf_url = "https://proceedings.iclr.cc/paper_files/paper/2026/file/1fa0c4e5a7e189729230d018b229abc7-Paper-Conference.pdf"
abstract = "We propose SafeMPO, a constrained reinforcement learning framework that incorporates safety constraints directly into the policy optimization process through safety-aware policy updates. By jointly optimizing task performance and constraint satisfaction, SafeMPO improves policy learning while reducing safety violations and maintaining strong overall performance."
