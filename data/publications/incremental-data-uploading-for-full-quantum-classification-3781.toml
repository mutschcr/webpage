title = "Incremental Data-Uploading for Full-Quantum Classification"
authors = ["Maniraman Periyasamy", "Nico Meyer", "Christian Ufrecht", "Daniel D Scherer", "Axel Plinge", "Christopher Mutschler"]
date = "2022-01-01"
venue = "IEEE International Conference on Quantum Computing and Engineering (QCE)"
detail_url = "/publication/incremental-data-uploading-for-full-quantum-classification/"
profiles = ["christopher-mutschler", "nico-meyer"]
doi = "https://doi.org/10.1109/QCE53715.2022.00021"
abstract = "This work proposes ‘incremental data-uploading’, a novel encoding pattern for high dimensional data that tackles these challenges. We spread the encoding gates for the feature vector of a given data point throughout the quantum circuit with parameterized gates in between them. This encoding pattern results in a better representation of data in the quantum circuit with a minimal pre-processing requirement. We show the efficiency of our encoding pattern on a classification task using the MNIST and Fashion-MNIST datasets, and compare different encoding methods via classification accuracy and the effective dimension of the model."
