title = "Convolutional Neural Networks for Position Estimation in TDoA-based Locating Systems"
authors = ["Arne Niitsoo", "Thorsten Edelhäußer", "Christopher Mutschler"]
date = "2018-01-01"
venue = "9th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/convolutional-neural-networks-for-position-estimation-in-tdoa-based-locating-systems/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN.2018.8533766"
abstract = "We propose a signal processing method that uses deep learning to estimate the absolute tag position directly from the raw channel impulse response (CIR) data. We use the CIR together with ground truth positional data to train a convolutional neural network (CNN) that not only estimates non-linearities in the signal propagation space but also analyzes the signal for multipath effects. Our evaluation shows that our position estimation works in multipath environments and also outperforms classical signal processing in line-of-sight situations."
