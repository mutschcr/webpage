title = "Indoor Positioning using OFDM-based Visible Light Communications Systems"
authors = ["Birendra Ghimire", "Jochen Seitz", "Christopher Mutschler"]
date = "2018-01-01"
venue = "9th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/indoor-positioning-using-ofdm-based-visible-light-communications-systems/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN.2018.8533834"
abstract = "We propose a novel positioning system which uses the entities of visible light communication (VLC) system as anchors and tags. Our technique scales with the number of tags and the VLC network provides both positioning and communication capabilities. The anchor points transmit the OFDM-based VLC signals synchronously, and we estimate the time differences of arrival between anchor points and tags using positioning reference signals embedded into the air-interface of the VLC system. Simulation results show that positioning accuracy of 10 cm or better is possible for over 95% of users if the sampling clock offset is better that 10 ppm, clock jitter is below 1 ps, and a bit resolution of at least 16 bits is available."
