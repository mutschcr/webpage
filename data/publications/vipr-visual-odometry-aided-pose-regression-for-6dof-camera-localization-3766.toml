title = "ViPR: Visual-Odometry-aided Pose Regression for 6DoF Camera Localization"
authors = ["Felix Ott", "Tobias Feigl", "Christoffer Loffler", "Christopher Mutschler"]
date = "2020-01-01"
venue = "IEEE/CVF CVPR Workshops"
detail_url = "/publication/vipr-visual-odometry-aided-pose-regression-for-6dof-camera-localization/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/CVPRW50498.2020.00029"
abstract = "We propose ViPR, a novel modular architecture for longterm 6DoF VO that leverages temporal information and synergies between absolute pose estimates (from PoseNet-like modules) and relative pose estimates (from FlowNet-based modules) by combining both through recurrent layers. Experiments on known datasets and on our own Industry dataset show that our modular design outperforms state of the art in long-term navigation tasks."
