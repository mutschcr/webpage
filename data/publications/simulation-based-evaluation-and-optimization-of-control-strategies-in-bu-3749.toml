title = "Simulation-based Evaluation and Optimization of Control Strategies in Buildings"
authors = ["Georgios D Kontes", "Georgios I Giannakis", "Víctor Sánchez", "De Agustin-Camacho", "Ander Romero-Amorrortu", "Natalia Panagiotidou", "Dimitrios V Rovas", "Simone Steiger", "Christopher Mutschler", "Gunnar Gruen"]
