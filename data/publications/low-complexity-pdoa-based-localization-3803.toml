title = "Low-Complexity PDoA-based Localization"
authors = ["Benjamin Sackenreuter", "Niels Hadaschik", "Marc Fassbinder", "Christopher Mutschler"]
date = "2016-01-01"
venue = "7th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/low-complexity-pdoa-based-localization/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN.2016.7743692"
abstract = "We present a concept for energy-efficient low-complexity localization based on Phase Difference of Arrival (PDoA). Besides a novel method for reference transmitter selection we propose a waveform, well-suited for PDoA measurements, and evaluate its ranging performance. We compare multiple signal classification (MUSIC), linear fitting, and mean phase difference and compare their estimation variance to the Cramer Rao Lower Bound (CRLB). Our system concept allows for the mitigation of near-far effects for reference and tag signals at the receiver nodes, and an efficient implementation of a wideband frequency hopping scheme."
