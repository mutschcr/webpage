title = "Few-shot learning with uncertainty-based quadruplet selection for interference classification in GNSS data"
authors = ["Felix Ott", "Lucas Heublein", "Nisha Lakshmana Raichur", "Tobias Feigl", "Jonathan Hansen", "Alexander Rügamer", "Christopher Mutschler"]
date = "2024-01-01"
venue = "2024 International Conference on Localization and GNSS (ICL-GNSS)"
detail_url = "/publication/few-shot-learning-with-uncertainty-based-quadruplet-selection-for-interference-classification-in-gnss-data/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/ICL-GNSS60721.2024.10578525"
abstract = "We propose a few-shot learning (FSL) approach to adapt to new interference classes. Our method employs quadruplet selection for the model to learn representations using various positive and negative interference classes. Furthermore, our quadruplet vari-ant selects pairs based on the aleatoric and epistemic uncertainty to differentiate between similar classes. We recorded a dataset at a motorway with eight interference classes on which our FSL method with quadruplet loss outperforms other FSL techniques in jammer classification accuracy with 97.66%. https://gitlab.cc-asp.fraunhofer.de/darcy_gnsslFIOT_highway."
