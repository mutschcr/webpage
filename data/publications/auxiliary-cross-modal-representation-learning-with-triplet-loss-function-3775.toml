title = "Auxiliary Cross-Modal Representation Learning with Triplet Loss Functions for Online Handwriting Recognition"
authors = ["Felix Ott", "David Rügamer", "Lucas Heublein", "Bernd Bischl", "Christopher Mutschler"]
date = "2023-01-01"
venue = "IEEE Access"
detail_url = "/publication/auxiliary-cross-modal-representation-learning-with-triplet-loss-functions-for-online-handwriting-recognition/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/ACCESS.2023.3310819"
abstract = "We present a triplet loss with a dynamic margin for single label and sequence-to-sequence classification tasks. We perform extensive evaluations on synthetic image and time-series data, and on data for offline handwriting recognition (HWR) and on online HWR from sensor-enhanced pens for classifying written words. Our experiments show an improved classification accuracy, faster convergence, and better generalizability due to an improved cross-modal representation. Furthermore, the more suitable generalizability leads to a better adaptability between writers for online HWR."
