abstract="Radio-based indoor localization is a crucial enabler for various tasks like robot navigation or quality assurance in industrial assembly. However, especially industrial environments often present challenging propagation conditions, with reflections, diffraction obstruction, and blockage. While traditional, lateration-based positioning algorithms can provide high accuracies in line-of-sight (LOS) conditions, signal blockages cause non-line-of-sight (NLOS) propagation and degrade the performance dramatically. To overcome this problems, recently artificial intelligence (AI)-driven localization algorithms have shown promising results and can provide robust and high localization performance in such challenging environments. In this chapter, we evaluate the performance of AI-models trained on radio fingerprints in various challenging industrial environments. We evaluate the accuracy and the effect of environmental changes on the localization performance and robustness. Our results show that environmental changes significantly degrade the performance, which leads to a high effort in maintenance, i.e., keeping the models up-to-date. We show how to combine classical lateration-based algorithms with data-driven models employing uncertainty estimation to reduce the the effort for initial deployment and maintenance for a more robust localization solution.",
isbn="978-3-031-64832-8",
doi="10.1007/978-3-031-64832-8_10",
url="https://doi.org/10.1007/978-3-031-64832-8_10"
}'''

