title = "uYOLO: Towards Single-Shot Object Detection on Microcontrollers"
authors = ["Mark Deutel", "Christopher Mutschler", "Jürgen Teich"]
date = "2023-01-01"
venue = "Joint European Conference on Machine Learning and Knowledge Discovery in Databases"
detail_url = "/publication/uyolo-towards-single-shot-object-detection-on-microcontrollers/"
profiles = ["christopher-mutschler", "mark-deutel"]
doi = "https://doi.org/10.1007/978-3-031-74643-7_13"
abstract = "This work-in-progress paper presents results on the feasibility of single-shot object detection on microcontrollers using YOLO. Single-shot object detectors like YOLO are widely used, however due to their complexity mainly on larger GPU-based platforms. We present YOLO, which can be used on Cortex-M based microcontrollers, such as the OpenMV H7 R2, achieving about 3.5 FPS when classifying 128128 RGB images while using less than 800 KB Flash and less than 350 KB RAM. Furthermore, we share experimental results for three different object detection tasks, analyzing the accuracy of YOLO on them."
