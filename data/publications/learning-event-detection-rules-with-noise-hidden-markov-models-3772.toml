title = "Learning Event Detection Rules with Noise Hidden Markov Models"
authors = ["Christopher Mutschler", "Michael Philippsen"]
date = "2012-01-01"
venue = "2012 NASA/ESA Conference on Adaptive Hardware and Systems (AHS)"
detail_url = "/publication/learning-event-detection-rules-with-noise-hidden-markov-models/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/AHS.2012.6268645"
abstract = "We present a method, by which a domain expert can simply signal the occurrence of a significant incident at a specific point in time. The system then infers rules for automatically detecting such occurrences later on. At the core of our approach is an extension of hidden Markov models (HMM) called noise hidden Markov models (nHMM) that can be trained with existing, low-level event data. The nHMM can be applied online without any intervention of programming experts. An evaluation on both synthetic and real event data shows the efficiency of our approach even under the presence of highly frequent, insignificant events and uncertainty in the data."
