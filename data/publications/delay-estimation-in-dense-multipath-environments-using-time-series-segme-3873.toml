title = "Delay Estimation in Dense Multipath Environments using Time Series Segmentation"
authors = ["Sebastian Kram", "Christopher Kraus", "Maximilian Stahlke", "Tobias Feigl", "Jörn Thielecke", "Christopher Mutschler"]
date = "2022-01-01"
venue = "IEEE Wireless Communications and Networking Conference"
detail_url = "/publication/delay-estimation-in-dense-multipath-environments-using-time-series-segmentation/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/WCNC51071.2022.9771875"
abstract = "We propose a pipeline built upon the U-Net convolutional neural network architecture. Unlike the state of the art our pipeline extracts an arbitrary number of delays without prior knowledge, includes a threshold for weighting between detection rate and false alarms, and does not rely on computationally demanding operations such as eigenvalue decomposition. We evaluate the presented method with synthetic data of different noise configurations and signal bandwidths and a publicly available dataset, achieving considerable performance gains w.r.t. detection performance and tracking accuracy. Furthermore, we show that the proposed method is far less computationally demanding in inference."
