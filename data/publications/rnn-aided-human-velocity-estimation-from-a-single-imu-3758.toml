profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.3390/s20133656"
abstract = "We propose a hybrid filter that combines a convolutional neural network (CNN) and a bidirectional recurrent neural network (BLSTM) (that extract spatial features from the sensor signals and track their temporal relationships) with a linear Kalman filter (LKF) that improves the velocity estimates. Our experiments show the robustness against different movement states and changes in orientation, even in highly dynamic situations. It also generalizes well to different and varying movement speeds and provides accurate and precise velocity estimates."
