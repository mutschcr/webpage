AUTHOR = {Feigl, Tobias and Kram, Sebastian and Woller, Philipp and Siddiqui, Ramiz H. and Philippsen, Michael and Mutschler, Christopher},
TITLE = {RNN-Aided Human Velocity Estimation from a Single IMU},
