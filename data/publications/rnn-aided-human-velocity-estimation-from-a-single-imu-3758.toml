title = "RNN-aided Human Velocity Estimation from a Single IMU"
authors = ["Tobias Feigl", "Sebastian Kram", "Philipp Woller", "Ramiz H Siddiqui", "Michael Philippsen", "Christopher Mutschler"]
date = "2020-01-01"
venue = "Sensors"
