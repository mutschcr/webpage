abstract="Reinforcement Learning (RL) is one of the branches of Machine Learning (ML) that aims to learn from the interaction with an environment. In contrast to approaches such as supervised or unsupervised learning, where data samples usually are assigned to a ground truth label (supervised learning) or where they follow some stationary distribution (unsupervised learning), in RL, the agent is learning in direct interaction with the environment. This also defines what data is being collected as a result of which actions are being executed. The agent is hence learning from experience. While more traditionally, RL was focused purely on continuously arriving data, lately also approaches that resort to a given data pool of past environment interactions have gained more and more interest. This chapter covers the basics of RL and discusses the latest research in interactive environments, learning with available data or knowledge, and challenges that arise from the actual deployment of agents to the real world.",
isbn="978-3-031-64832-8",
