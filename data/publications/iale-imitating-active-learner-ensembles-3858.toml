title = "IALE: Imitating Active Learner Ensembles"
authors = ["Christoffer Löffler", "Christopher Mutschler"]
date = "2022-01-01"
venue = "Journal of Machine Learning Research (JMLR)"
detail_url = "/publication/iale-imitating-active-learner-ensembles/"
profiles = ["christopher-mutschler"]
abstract = "We propose IALE, an imitation learning scheme that imitates the selection of the best-performing expert heuristic at each stage of the learning cycle in a batch-mode pool-based setting. We use Dagger to train a transferable policy on a dataset and later apply it to different datasets and deep classifier architectures. The policy reflects on the best choices from multiple expert heuristics given the current state of the active learning process, and learns to select samples in a complementary way that unifies the expert strategies. Our experiments on well-known image datasets show that we outperform state of the art imitation learners and heuristics."
