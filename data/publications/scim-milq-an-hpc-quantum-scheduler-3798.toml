doi = "https://doi.org/10.1109/QCE60285.2024.10294"
abstract = "SCIM MILQ is a scheduler for quantum tasks in HPC infrastructure. It combines well-established scheduling techniques with methods unique to quantum computing, such as circuit cutting. SCIM MILQ can schedule tasks while minimizing the makespan, i.e., the time that elapses from the start of work to the end, improving on average by 25 %. Additionally, it reduces the noise in the circuit by up to 10 %, increasing the outcome's reliability. We compare it against an existing baseline and show its viability in an HPC environment."
