title = "Cutting Multi-Control Quantum Gates with ZX Calculus"
authors = ["Christian Ufrecht", "Maniraman Periyasamy", "Sebastian Rietsch", "Daniel D Scherer", "Axel Plinge", "Christopher Mutschler"]
date = "2023-01-01"
venue = "Quantum"
detail_url = "/publication/cutting-multi-control-quantum-gates-with-zx-calculus/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.22331/q-2023-10-23-1147"
abstract = "Circuit cutting, the decomposition of a quantum circuit into independent partitions, has become a promising avenue towards experiments with larger quantum circuits in the noisy-intermediate scale quantum (NISQ) era. While previous work focused on cutting qubit wires or two-qubit gates, in this work we introduce a method for cutting multi-controlled Z gates. We construct a decomposition and prove the upper bound O(6^2K) on the associated sampling overhead, where K is the number of cuts in the circuit. This bound is independent of the number of control qubits but can be further reduced to O(4.5^2K) for the special case of CCZ gates. Furthermore, we evaluate our proposal on IBM hardware and experimentally show noise resilience due to the strong reduction of CNOT gates in the cut circuits."
