title = "Combining Multi-Objective Bayesian Optimization with Reinforcement Learning for TinyML"
authors = ["Mark Deutel", "Georgios Kontes", "Christopher Mutschler", "Jürgen Teich"]
date = "2025-01-01"
venue = "ACM Transactions on Evolutionary Learning (TELO)"
detail_url = "/publication/combining-multi-objective-bayesian-optimization-with-reinforcement-learning-for-tinyml/"
profiles = ["christopher-mutschler", "mark-deutel"]
doi = "https://doi.org/10.1145/3715012"
abstract = "We propose a novel NAS strategy for TinyML based on multi-objective Bayesian optimization (MOBOpt) and an ensemble of competing parametric policies trained using augmented random search (ARS) reinforcement learning (RL) agents. Our methodology aims at efficiently finding tradeoffs between a DNN’s predictive accuracy, memory requirements on a given target system, and computational complexity. Our experiments show that we consistently outperform existing MOBOpt approaches on different datasets and architectures such as ResNet-18 and MobileNetv3."
