title = "NLOS Detection using UWB Channel Impulse Responses and Convolutional Neural Networks"
authors = ["Maximilian Stahlke", "Sebastian Kram", "Christopher Mutschler", "Thomas Mahr"]
date = "2020-01-01"
venue = "2020 International Conference on Localization and GNSS (ICL-GNSS)"
detail_url = "/publication/nlos-detection-using-uwb-channel-impulse-responses-and-convolutional-neural-networks/"
profiles = ["christopher-mutschler"]
abstract = "We apply different convolutional neural network architectures (ResNet, Encoder, FCN) to detect non line-of-sight (NLOS) channel conditions directly from the CIR raw data. A realistic measurement campaign is used to train and evaluate the algorithms. The proposed methods highly outperform the featurebased ML baselines while still using low network complexities. We also show that the models generalize well to unknown receivers and environments and that positioning filters benefit significantly from the identification of NLOS measurements."
