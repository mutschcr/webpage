title = "Adaptive Speculative Processing of Out-of-Order Event Streams"
authors = ["Christopher Mutschler", "Michael Philippsen"]
date = "2014-01-01"
venue = "ACM Transactions on Internet Technology (TOIT)"
detail_url = "/publication/adaptive-speculative-processing-of-out-of-order-event-streams/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1145/2633686"
abstract = "We present an adaptive speculative processing technique for out-of-order event streams that enhances typical buffering approaches. Our novel technique encapsulates the event detector, uses the buffering technique to delay events but also speculatively processes a portion of it, and adapts the degree of speculation at runtime to fit the available system resources so that detection latency becomes minimal. Our technique outperforms known approaches on both synthetical data and real sensor data from a realtime locating system (RTLS) with several thousands of out-of-order sensor events per second. Speculative buffering exploits system resources and reduces latency by 40% on average."
