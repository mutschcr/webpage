bibtex = "@inproceedings{10.1145/3712255.3734232, author = {Deutel, Mark and Kontes, Georgios and Mutschler, Christopher and Teich, J{\\\"u}rgen}, title = {Multi-Objective Bayesian Optimization with Reinforcement Learning for Edge Deployment of DNNs on Microcontrollers}, year = {2025}, isbn = {9798400714641}, publisher = {Association for Computing Machinery}, address = {New York, NY, USA}, url = {https://doi.org/10.1145/3712255.3734232}, doi = {10.1145/3712255.3734232}, abstract = {Deploying deep neural networks (DNNs) on microcontroller units (MCUs) is a common trend to process the increasing amount of sensor data generated at the edge, but it is challenging due to resource and latency constraints. Neural architecture search (NAS) helps automate the search for suitable DNNs. In our original work \"Combining Multi-Objective Bayesian Optimization with Reinforcement Learning for TinyML\" [3], we present a novel NAS strategy for edge deployment using multi-objective Bayesian optimization (MOBOpt) and reinforcement learning (RL). Our approach efficiently balances accuracy, memory, and computational complexity, outperforming existing methods on multiple datasets and architectures such as ResNet-18 and MobileNetV3.}, booktitle = {Proceedings of the Genetic and Evolutionary Computation Conference Companion}, pages = {19–20}, numpages = {2}, keywords = {neural architecture search, embedded systems, reinforcement learning, multi-objective bayesian optimization}, location = {NH Malaga Hotel, Malaga, Spain}, series = {GECCO '25 Companion} }"

