title = "Attention-based Fusion of IQ and FFT Spectrograms with AoA Features for GNSS Jammer Localization"
authors = ["Lucas Heublein", "Christian Wielenberg", "Thorsten Nowak", "Tobias Feigl", "Christopher Mutschler", "Felix Ott"]
date = "2025-01-01"
venue = "2025 IEEE Radar Conference (RadarConf25)"
detail_url = "/publication/attention-based-fusion-of-iq-and-fft-spectrograms-with-aoa-features-for-gnss-jammer-localization/"
profiles = ["christopher-mutschler", "christian-wielenberg"]
doi = "https://doi.org/10.1109/RadarConf2559087.2025.11204959"
abstract = '''
We propose an approach for detecting and classifying interference while estimating the distance, azimuth, and elevation of jamming sources. We evaluate 128 vision encoder and time-series models to identify the highest-performing methods for each task and introduce an attention-based fusion framework that integrates in-phase and quadrature (IQ) samples with Fast Fourier Transform (FFT)-computed spectrograms while incorporating 22 AoA features
to enhance localization accuracy.'''
