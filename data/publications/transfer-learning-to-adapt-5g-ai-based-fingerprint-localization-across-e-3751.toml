title = "Transfer Learning to adapt 5G AI-based Fingerprint Localization across Environments"
authors = ["Maximilian Stahlke", "Tobias Feigl", "Mario H Castañeda García", "Richard A Stirling-Gallacher", "Jochen Seitz", "Christopher Mutschler"]
date = "2022-01-01"
venue = "2022 IEEE 95th Vehicular Technology Conference: (VTC2022-Spring)"
detail_url = "/publication/transfer-learning-to-adapt-5g-ai-based-fingerprint-localization-across-environments/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/VTC2022-Spring54318.2022.9860906"
abstract = "We propose a transfer learning (TL) method that exploits realistic synthetic Channel State Information (CSI) obtained with the Quasi Deterministic Radio channel Generator (QuaDRiGa), used to pre-train the CNN-based fingerprint model so that it can be adapted to any real (NLoS) propagation scenario with a low number of real training samples. Our experiments show that the positioning accuracy using fine-tuning improves by 37% in changed and by 19% in new environments."
