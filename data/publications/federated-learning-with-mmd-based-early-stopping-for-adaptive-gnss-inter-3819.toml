title = "Federated learning with MMD-based early stopping for adaptive GNSS interference classification"
authors = ["Nishant S Gaikwad", "Lucas Heublein", "Nisha L Raichur", "Tobias Feigl", "Christopher Mutschler", "Felix Ott"]
date = "2025-01-01"
venue = "NOMS 2025-2025 IEEE Network Operations and Management Symposium"
detail_url = "/publication/federated-learning-with-mmd-based-early-stopping-for-adaptive-gnss-interference-classification/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/NOMS57970.2025.11073735"
abstract = '''
We propose an FL approach using few-shot learning and aggregation of the model weights on a global server. We introduce a dynamic early stopping method to balance out-of-distribution classes based on representation learning, specifically utilizing the maximum mean discrepancy of feature embeddings between local and global models. An exemplary application of FL is to orchestrate machine learning models along highways for interference classification based on snapshots from global navigation satellite system (GNSS) receivers. 

Dataset/Code: https://gitlab.cc-asp.fraunhofer.de/darcy_gnss/federated_learning'''
