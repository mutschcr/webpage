title = "An Empirical Comparison of Optimizers for Quantum Machine Learning with SPSA-based Gradients"
authors = ["Marco Wiedmann", "Marc Hölle", "Maniraman Periyasamy", "Nico Meyer", "Christian Ufrecht", "Daniel D Scherer", "Axel Plinge", "Christopher Mutschler"]
date = "2023-01-01"
venue = "2023 IEEE International Conference on Quantum Computing and Engineering (QCE)"
detail_url = "/publication/an-empirical-comparison-of-optimizers-for-quantum-machine-learning-with-spsa-based-gradients/"
profiles = ["christopher-mutschler", "nico-meyer"]
doi = "https://doi.org/10.1109/QCE57702.2023.00058"
abstract = "We introduce a novel approach that uses the approximated gradient from SPSA in combination with state-of-the-art gradient-based classical optimizers. We demonstrate numerically that this out-performs both standard SPSA and the parameter-shift rule in terms of convergence rate and absolute error in simple regression tasks. The improvement of our novel approach over SPSA with stochastic gradient descent (SGD) is even amplified when shot- and hardware-noise are taken into account. We also demonstrate that error mitigation does not significantly affect our results."
