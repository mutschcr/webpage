title = "Acoustical Manipulation for Redirected Walking"
authors = ["Tobias Feigl", "Eliise Kõre", "Christopher Mutschler", "Michael Philippsen"]
date = "2017-01-01"
venue = "23rd ACM Symposium on Virtual Reality Software and Technology (VRST '17)"
