title = "Supervised Learning for Yaw Orientation Estimation"
authors = ["Tobias Feigl", "Christopher Mutschler", "Michael Philippsen"]
date = "2018-01-01"
venue = "9th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/supervised-learning-for-yaw-orientation-estimation/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN.2018.8533811"
abstract = "Our novel yaw orientation estimation combines a single inertial sensor located at the human's head with inaccurate positional tracking. We exploit that humans tend to walk in their viewing direction and that they also tolerate some orientation drift. We classify head and body motion and estimate heading drift to enable low-cost long-time stable head orientation in NP tracking on 100 m×100 m. Our evaluation shows that we estimate heading reasonably well."
