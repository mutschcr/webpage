title = "Beyond Replication: Augmenting Social Behaviors in Multi-User Virtual Realities"
authors = ["Daniel Roth", "Constantin Kleinbeck", "Tobias Feigl", "Christopher Mutschler", "Marc Erich Latoschik"]
