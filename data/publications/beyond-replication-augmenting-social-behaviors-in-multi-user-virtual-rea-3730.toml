abstract = "This paper presents a novel approach for the augmentation of social behaviors in virtual reality (VR) and designed three visual transformations for behavioral phenomena crucial to everyday social interactions: eye contact, joint attention, and grouping. We show that our results indicate that our approach can significantly increase social presence in multi-user environments and that the augmented experience appears more thought-provoking."
