abstract="A big challenge in implementing autonomous systems using reinforcement learning in a way to be used in the real world is to make them dependable, i.e., explainable and reliable. Automated and autonomous driving poses one of the biggest challenges to the development of artificial intelligence (AI), as it is technically demanding to solve the tasks involved in order to make a car act autonomously in real-world situations. However, unless autonomous systems become truly safe and dependable, they cannot be deployed in a real-world setup. Operating autonomous vehicles not only efficiently but also safely and reliably is even more challenging. This chapter explains several unique and innovative methods to illustrate dependable reinforcement learning in autonomous vehicles.",
