title = "Quantum Natural Policy Gradients: Towards Sample-Efficient Reinforcement Learning"
authors = ["Nico Meyer", "Daniel D Scherer", "Axel Plinge", "Christopher Mutschler", "Michael J Hartmann"]
date = "2023-01-01"
venue = "2023 IEEE International Conference on Quantum Computing and Engineering (QCE)"
detail_url = "/publication/quantum-natural-policy-gradients-towards-sample-efficient-reinforcement-learning/"
profiles = ["nico-meyer", "christopher-mutschler"]
doi = "https://doi.org/10.1109/QCE57702.2023.10181"
abstract = "We propose the quantum natural policy gradient (QNPG) algorithm - a second-order gradient-based routine that takes advantage of an efficient approximation of the quantum Fisher information matrix. We experimentally demonstrate that QNPG outperforms first-order based training on different Contextual Bandits environments regarding convergence speed and stability and moreover reduces the sample complexity. Furthermore, we provide evidence for the practical feasibility of our approach by training on a 12-qubit hardware device."
