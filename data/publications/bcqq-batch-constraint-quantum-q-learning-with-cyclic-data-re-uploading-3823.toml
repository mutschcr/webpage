title = "BCQQ: Batch-Constraint Quantum Q-Learning with Cyclic Data Re-uploading"
authors = ["Maniraman Periyasamy", "Marc Hölle", "Marco Wiedmann", "Daniel D Scherer", "Axel Plinge", "Christopher Mutschler"]
date = "2024-01-01"
venue = "2024 International Joint Conference on Neural Networks (IJCNN)"
detail_url = "/publication/bcqq-batch-constraint-quantum-q-learning-with-cyclic-data-re-uploading/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IJCNN60899.2024.10651268"
abstract = "In this paper, we investigate this potential advantage by proposing a batch RL algorithm that utilizes variational quantum circuits (VQCs) as function approximators within the discrete batch-constraint deep Q-learning (BCQ) algorithm. Additionally, we introduce a novel data re-uploading scheme by cyclically shifting the order of input variables in the data encoding layers. We evaluate the efficiency of our algorithm on the OpenAI CartPole environment and compare its performance to the classical neural network-based discrete BCQ."
