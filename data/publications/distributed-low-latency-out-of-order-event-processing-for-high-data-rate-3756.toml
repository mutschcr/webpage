title = "Distributed Low-Latency Out-of-Order Event Processing for High Data Rate Sensor Streams"
authors = ["Christopher Mutschler", "Michael Philippsen"]
date = "2013-01-01"
venue = "27th IEEE International Symposium on Parallel & Distributed Processing (IPDPS)"
detail_url = "/publication/distributed-low-latency-out-of-order-event-processing-for-high-data-rate-sensor-streams/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPDPS.2013.29"
abstract = "We present a low-latency approach based on K-slack that achieves ordered event processing on high data rate sensor and event streams without a-priori knowledge. Slack buffers are dynamically adjusted to fit the disorder in the streams without using local or global clocks. The middleware transparently reorders the event input streams so that events can still be aggregated and processed to a granularity that satisfies the demands of the application. On a Realtime Locating System (RTLS) our system performs accurate low-latency event detection under the predominance of out-of-order event arrival and with a close to linear performance scale-up when the system is distributed over several threads and machines."
