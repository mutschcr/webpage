doi = "http://INPROCEEDINGS{8533862,   author={Löffler, Christoffer and Riechel, Sascha and Fischer, Janina and Mutschler, Christopher},   booktitle={2018 International Conference on Indoor Positioning and Indoor Navigation (IPIN)},    title={Evaluation Criteria"
abstract = "This paper proposes evaluation criteria that consider algorithmic properties of ML-based positioning schemes and introduces a dataset from an indoor warehouse scenario to evaluate for them. Our dataset consists of images labeled with millimeter precise positions that allows for a better development and performance evaluation of learning algorithms. This allows an evaluation of machine learning algorithms for monocular optical positioning in a realistic indoor position application for the first time. We also show the feasibility of ML-based positioning schemes for an industrial deployment."
