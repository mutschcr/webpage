title = "Driver Dojo: A Benchmark for Generalizable Reinforcement Learning for Autonomous Driving"
authors = ["Sebastian Rietsch", "Shih-Yuan Huang", "Georgios Kontes", "Axel Plinge", "Christopher Mutschler"]
date = "2022-01-01"
venue = "arXiv"
detail_url = "/publication/driver-dojo-a-benchmark-for-generalizable-reinforcement-learning-for-autonomous-driving/"
profiles = ["christopher-mutschler"]
abstract = '''
We propose a challenging benchmark for generalizable RL for AD based on a configurable, flexible, and performant code base. Our benchmark uses a catalog of randomized scenario generators, including multiple mechanisms for road layout and traffic variations, different numerical and visual observation types, distinct action spaces, diverse vehicle models, and allows for use under static scenario definitions. In addition to purely algorithmic insights, our application-oriented benchmark also enables a better understanding of the impact of design decisions such as action and observation space on the generalizability of policies. Our benchmark aims to encourage researchers to propose solutions that are able to successfully generalize across scenarios, a task in which current RL methods fail. 

Code available here: https://github.com/seawee1/driver-dojo'''
