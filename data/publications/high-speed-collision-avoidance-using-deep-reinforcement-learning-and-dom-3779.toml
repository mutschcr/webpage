title = "High-Speed Collision Avoidance using Deep Reinforcement Learning and Domain Randomization for Autonomous Vehicles"
authors = ["Georgios D Kontes", "Daniel D Scherer", "Tim Nisslbeck", "Janina Fischer", "Christopher Mutschler"]
date = "2020-01-01"
venue = "2020 IEEE 23rd International Conference on Intelligent Transportation Systems (ITSC)"
detail_url = "/publication/high-speed-collision-avoidance-using-deep-reinforcement-learning-and-domain-randomization-for-autonomous-vehicles/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/ITSC45102.2020.9294396"
abstract = '''
We use domain randomization to study simulation-to-reality transfer for a high-speed collision avoidance scenario. We train the policy not only on a single version of the setup but on several variations. Our experiments show that the resulting policy is able to generalize much better to different values for the vehicle speed and distance from the obstacle compared to policies trained in the non-randomized version of the setup.

Video: https://download.cmutschler.de/publications/2020/ITSC/0703_VP.mp4
Slides: https://download.cmutschler.de/publications/2020/ITSC/0703_PS.pdf'''
