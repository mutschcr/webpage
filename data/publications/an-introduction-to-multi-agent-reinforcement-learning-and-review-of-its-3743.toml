title = "An Introduction to Multi-Agent Reinforcement Learning and Review of its Application to Autonomous Mobility"
authors = ["Lukas M Schmidt", "Johanna Brosig", "Axel Plinge", "Bjoern M Eskofier", "Christopher Mutschler"]
date = "2022-01-01"
venue = "2022 IEEE 25th International Conference on Intelligent Transportation Systems (ITSC)"
detail_url = "/publication/an-introduction-to-multi-agent-reinforcement-learning-and-review-of-its-application-to-autonomous-mobility/"
