title = "Energy-Efficient Deployment of Deep Learning Applications on Cortex-M based Microcontrollers using Deep Compression"
authors = ["Mark Deutel", "Philipp Woller", "Christopher Mutschler", "Jürgen Teich"]
date = "2023-01-01"
venue = "26th MBMV Workshop (Methoden und Beschreibungssprachen zur Modellierung und Verifikation von Schaltungen und Systemen)"
detail_url = "/publication/energy-efficient-deployment-of-deep-learning-applications-on-cortex-m-based-microcontrollers-using-deep-compression/"
profiles = ["christopher-mutschler", "mark-deutel"]
abstract = "We present a methodology for systematically exploring different DNN pruning, quantization, and deployment strategies for different microcontroller architectures, with a focus on lowpower ARM Cortex-M-based systems. The exploration allows to analyze trade-offs between key metrics such as accuracy, memory consumption, execution time, and power consumption. We discuss experimental results on three different DNN architectures and show that we can compress them to less than 10% of their original parameter count before their prediction quality degrades."
