title = "Uncertainty-aware Evaluation of Time-Series Classification for Online Handwriting Recognition with Domain Shift"
authors = ["Andreas Klaß", "Sven M Lorenz", "Martin W Lauer-Schmaltz", "David Rügamer", "Bernd Bischl", "Christopher Mutschler", "Felix Ott"]
date = "2022-01-01"
venue = "IJCAI-ECAI Intl. Workshop on Spatio-Temporal Reasoning and Learning (STRL)"
detail_url = "/publication/uncertainty-aware-evaluation-of-time-series-classification-for-online-handwriting-recognition-with-domain-shift/"
profiles = ["christopher-mutschler"]
abstract = "In this paper, we focus on models for online handwriting recognition, one particular type of spatio-temporal data. The data is observed from a sensor-enhanced pen with the goal to classify written characters. We conduct a broad evaluation of aleatoric (data) and epistemic (model) UQ based on two prominent techniques for Bayesian inference, Stochastic Weight Averaging-Gaussian (SWAG) and Deep Ensembles. Next to a better understanding of the model, UQ techniques can detect out-of-distribution data and domain shifts when combining right-handed and left-handed writers (an underrepresented group)."
