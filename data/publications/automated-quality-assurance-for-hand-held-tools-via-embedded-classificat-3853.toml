title = "Automated Quality Assurance for Hand-held Tools via Embedded Classification and AutoML"
authors = ["Christoffer Löffler", "Christian Nickel", "Christopher Sobel", "Daniel Dzibela", "Jonathan Braat", "Benjamin Gruhler", "Philipp Woller", "Nicolas Witt", "Christopher Mutschler"]
date = "2020-01-01"
venue = "Joint European Conference on Machine Learning and Knowledge Discovery in Databases (ECML-PKDD)"
