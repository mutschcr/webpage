profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1007/978-3-030-67670-4_33"
abstract = "We introduce a process monitoring system that uses inertial, magnetic field and audio sensors that we attach as add-ons to hand-held tools. The sensor data is analyzed via embedded classification algorithms and our system directly provides feedback to workers during the execution of work processes. We outline the special requirements caused by vastly different tools and show how to automatically train and deploy new ML models."
