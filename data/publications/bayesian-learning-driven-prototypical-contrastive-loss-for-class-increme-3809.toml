title = "Bayesian Learning-driven Prototypical Contrastive Loss for Class-Incremental Learning"
authors = ["Nisha L Raichur", "Lucas Heublein", "Tobias Feigl", "Alexander Rügamer", "Christopher Mutschler", "Felix Ott"]
date = "2025-01-01"
venue = "Transactions on Machine Learning Research (TMLR)"
detail_url = "/publication/bayesian-learning-driven-prototypical-contrastive-loss-for-class-incremental-learning/"
profiles = ["christopher-mutschler"]
abstract = "This paper proposes a method to learn an effective representation between previous and newly encountered class prototypes. We propose a prototypical network with a Bayesian learning-driven contrastive loss (BLCL), tailored specifically for class-incremental learning scenarios. We introduce a contrastive loss that incorporates novel classes into the latent representation by reducing intra-class and increasing inter-class distance. Our approach dynamically adapts the balance between the cross-entropy and contrastive loss functions with a Bayesian learning technique."
