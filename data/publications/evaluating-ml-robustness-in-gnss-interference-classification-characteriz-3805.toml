title = "Evaluating ML Robustness in GNSS Interference Classification, Characterization & Localization"
authors = ["Lucas Heublein", "Tobias Feigl", "Thorsten Nowak", "Alexander Rügamer", "Christopher Mutschler", "Felix Ott"]
date = "2025-01-01"
venue = "International Conference on Localization and GNSS (ICL-GNSS)"
detail_url = "/publication/evaluating-ml-robustness-in-gnss-interference-classification-characterization-localization/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/ICL-GNSS65520.2025.11046126"
abstract = "We introduce an extensive dataset comprising snapshots obtained from a low-frequency antenna that capture various generated interferences within a large-scale environment, including controlled multipath effects. Our objective is to assess the resilience of machine learning (ML) models against environmental changes, such as multipath effects, variations in interference attributes, such as interference class, bandwidth, and signal power, the accuracy of jamming device localization, and the constraints imposed by snapshot input lengths. Furthermore, we evaluate the performance of a diverse set of 129 distinct vision encoder models across all tasks."
