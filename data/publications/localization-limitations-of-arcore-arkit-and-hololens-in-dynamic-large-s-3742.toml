title = "Localization Limitations of ARCore, ARKit, and Hololens in Dynamic Large-Scale Industry Environments"
authors = ["Tobias Feigl", "Andreas Porada", "Steve Steiner", "Christoffer Löffler", "Christopher Mutschler", "Michael Philippsen"]
date = "2020-01-01"
venue = "15th Intl. Joint Conf. on Computer Vision, Imaging and Computer Graphics Theory and Applications"
detail_url = "/publication/localization-limitations-of-arcore-arkit-and-hololens-in-dynamic-large-scale-industry-environments/"
profiles = ["christopher-mutschler"]
doi = "http://10.5220/0008989903070318"
abstract = "We study the applicability of today’s popular AR systems (Apple ARKit, Google ARCore, and Microsoft Hololens) in an industrial context (large area of 1,600m2, long walking distances of 60m between cubicles, and dynamic environments with volatile natural features). Out of the box, these AR systems are far from useful even for normal motion behavior. They accumulate an average error of about 17m per 120m, with a scaling error of up to 14.4cm/m that is quasi-directly proportional to the path length. By adding natural features, the tracking reliability can be improved, but not enough."
