title = "Qiskit-torch-module: Fast prototyping of quantum neural networks"
authors = ["Nico Meyer", "Christian Ufrecht", "Maniraman Periyasamy", "Axel Plinge", "Christopher Mutschler", "Daniel D Scherer", "Andreas Maier"]
date = "2024-01-01"
venue = "2024 IEEE International Conference on Quantum Computing and Engineering (QCE)"
detail_url = "/publication/qiskit-torch-module-fast-prototyping-of-quantum-neural-networks/"
profiles = ["christopher-mutschler", "nico-meyer"]
doi = "https://doi.org/10.1109/QCE60285.2024.00101"
abstract = "We develop the qiskit-torch-module, building on the widely used Qiskit software environment. It improves runtime performance by two orders of magnitude over comparable libraries, while facilitating low-overhead integration with existing code-bases. Moreover, the framework provides advanced tools for integrating quantum neural networks with PyTorch. The pipeline is tailored for single-machine compute systems, which constitute a widely employed setup in day-to-day research efforts."
