title = "Uncertainty-based fingerprinting model monitoring for radio localization"
authors = ["Maximilian Stahlke", "Tobias Feigl", "Sebastian Kram", "Bjoern M Eskofier", "Christopher Mutschler"]
date = "2024-01-01"
venue = "IEEE Journal of Indoor and Seamless Positioning and Navigation"
detail_url = "/publication/uncertainty-based-fingerprinting-model-monitoring-for-radio-localization/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/JISPIN.2024.3398568"
abstract = "In this article, we propose methods for uncertainty estimation of AI-based fingerprinting to determine its spatial boundaries and validity. Our experiments show that we can successfully identify spatial boundaries of the fingerprinting models and detect corrupted areas. In contrast to the state-of-the-art, our approach employs an intrinsic identification through out-of-distribution (OOD) detection, rendering external detection approaches unnecessary."
