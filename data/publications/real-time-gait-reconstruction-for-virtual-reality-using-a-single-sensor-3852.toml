title = "Real-time gait reconstruction for virtual reality using a single sensor"
authors = ["Tobias Feigl", "Lisa Gruner", "Christopher Mutschler", "Daniel Roth"]
date = "2020-01-01"
venue = "2020 IEEE International Symposium on Mixed and Augmented Reality Adjunct (ISMAR-Adjunct)"
detail_url = "/publication/real-time-gait-reconstruction-for-virtual-reality-using-a-single-sensor/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/ISMAR-Adjunct51615.2020.00037"
abstract = "We propose an approach to reconstruct gait motions from a single head-mounted accelerometer. We train our models to map head motions to corresponding ground truth gait phases. To reconstruct leg motion, the models predict gait phases to trigger equivalent synthetic animations. We designed four models: a threshold-based, a correlation-based, a Support Vector Machine (SVM) -based and a bidirectional long-term short-term memory (BLSTM) -based model. Our experiments show that, while the BLSTM approach is the most accurate, only the correlation approach runs on a mobile VR system in real time with sufficient accuracy. Our user study with 21 test subjects examined the effects of our approach on simulator sickness and showed significantly less negative effects on disorientation."
