title = "Simplicity is Key: An Unsupervised Pretraining Approach for Sparse Radio Channels"
authors = ["Jonathan Ott", "Maximilian Stahlke", "Tobias Feigl", "Bjoern M Eskofier", "Christopher Mutschler"]
date = "2025-01-01"
venue = "ICML 2025 Workshop on Machine Learning for Wireless Communication and Networks (ML4Wireless)"
detail_url = "/publication/simplicity-is-key-an-unsupervised-pretraining-approach-for-sparse-radio-channels/"
profiles = ["christopher-mutschler", "jonathan-ott", "alexander-mattick"]
abstract = "We introduce Sparse pretrained Radio Transformer (SpaRTran), a hybrid method based on the concept of compressed sensing for wireless channels. SpaRTran builds around a wireless channel model that constrains the optimization procedure to physically meaningful solutions and induces a strong inductive bias, cutting positioning error by up to 28% and increasing top-1 codebook selection accuracy for beamforming by 26 percentage points."
