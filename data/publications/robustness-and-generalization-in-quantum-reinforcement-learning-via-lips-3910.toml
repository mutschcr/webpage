title = "Robustness and generalization in quantum reinforcement learning via lipschitz regularization"
authors = ["Nico Meyer", "Julian Berberich", "Christopher Mutschler", "Daniel D Scherer"]
date = "2024-01-01"
venue = "arXiv"
detail_url = "/publication/robustness-and-generalization-in-quantum-reinforcement-learning-via-lipschitz-regularization/"
profiles = ["nico-meyer", "christopher-mutschler"]
abstract = "This paper addresses the robustness and generalization of quantum reinforcement learning by combining principles from quantum computing and control theory. Leveraging recent results on robust quantum machine learning, we utilize Lipschitz bounds to propose a regularized version of a quantum policy gradient approach, named the RegQPG algorithm. We show that training with RegQPG improves the robustness and generalization of the resulting policies. Furthermore, we introduce an algorithmic variant that incorporates curriculum learning, which minimizes failures during training. Our findings are validated through numerical experiments, demonstrating the practical benefits of our approach."
