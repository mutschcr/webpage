title = "Contact Tracing with the Exposure Notification Framework in the German Corona-Warn-App"
authors = ["Steffen Meyer", "Thomas Windisch", "Adrian Perl", "Daniel Dzibela", "Robert Marzilger", "Nicolas Witt", "Justus Benzler", "Göran Kirchner", "Tobias Feigl", "Christopher Mutschler"]
date = "2021-01-01"
venue = "11th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/contact-tracing-with-the-exposure-notification-framework-in-the-german-corona-warn-app/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN51156.2021.9662591"
abstract = "We examined the Google/Apple Exposure Notification Framework (ENF), which in combination with the front-end, i.e., the German Corona-Warn-App (CWA), enables digital CT in Germany. With centimeter accurate optical reference systems we show that optimal parameters are application-specific. However, they cause impractical high resource costs. In contrast, optimized general parameters offer an everyday compromise between energy costs, applicability, accuracy, and reliability of the ENF."
