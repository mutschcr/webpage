title = "Super-Resolution in RSS-based Direction-of-Arrival Estimation"
authors = ["Thorsten Nowak", "Markus Hartmann", "Jörn Thielecke", "Niels Hadaschik", "Christopher Mutschler"]
date = "2018-01-01"
venue = "9th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/super-resolution-in-rss-based-direction-of-arrival-estimation/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN.2018.8533684"
abstract = "In this paper, a subspace-based approach to frequency-domain multipath resolution is presented. Resolution of multipath components allows for a RSS-based DOA estimation considering the power of the line of sight (LOS) component only. The impact of the multipath channel is considerably reduced with our approach. In contrast to common broadband DOA estimation techniques, the presented approach does not need phase-coherent receive channels or a synchronized sensor network. Hence, the proposed super-resolution technique is applicable to low-power sensor networks and brings accurate positioning to small-sized and energy-efficient sensor nodes."
