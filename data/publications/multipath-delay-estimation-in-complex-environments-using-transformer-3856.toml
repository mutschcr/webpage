title = "Multipath delay estimation in complex environments using transformer"
authors = ["Jonathan Ott", "Maximilian Stahlke", "Sebastian Kram", "Tobias Feigl", "Christopher Mutschler"]
date = "2023-01-01"
venue = "2023 13th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/multipath-delay-estimation-in-complex-environments-using-transformer/"
profiles = ["christopher-mutschler", "jonathan-ott"]
doi = "https://doi.org/10.1109/IPIN57070.2023.10332470"
abstract = "We propose an MPC delay estimation pipeline based on a Transformer (TF) neural network, which implicitly estimates the number and delays of the MPCs. We achieve subsample accuracy without using computational expensive super-resolution techniques. Our approach outperforms state-of-the art on detection and delay estimation of MPCs on different bandwidths. We also show that our approach can easily be fine-tuned on real world data with very few labeled data samples, making it a well-suited candidate for real world deployments."
