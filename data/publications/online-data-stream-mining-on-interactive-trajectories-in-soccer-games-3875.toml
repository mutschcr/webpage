title = "Online Data Stream Mining on Interactive Trajectories in Soccer Games"
authors = ["Christopher Mutschler", "Gabriella Kókai", "Thorsten Edelhäußer"]
date = "2011-01-01"
venue = "2nd International Conference on Positioning and Context-Awareness"
detail_url = "/publication/online-data-stream-mining-on-interactive-trajectories-in-soccer-games/"
profiles = ["christopher-mutschler"]
abstract = "This paper proposes an online data mining method that is able to recognize repeating patterns of trajectory movements regardless of how they are scaled, rotated or translated. The result is an efficient data stream mining application, which provides meaningful information within the current game. The framework is designed in a modular manner in order to enhance the capabilities easily. The evaluation of the algorithms proves the efficiency of the provided concepts."
