title = "Warm-start variational quantum policy iteration"
authors = ["Nico Meyer", "Jakob Murauer", "Alexander Popov", "Christian Ufrecht", "Axel Plinge", "Christopher Mutschler", "Daniel D Scherer"]
date = "2024-01-01"
venue = "2024 IEEE International Conference on Quantum Computing and Engineering (QCE)"
detail_url = "/publication/warm-start-variational-quantum-policy-iteration/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/QCE60285.2024.00172"
abstract = "We propose the variational quantum policy iteration (VarQPI) algorithm, realizing this step with a NISQ-compatible quantum-enhanced subroutine. Its scalability is supported by an analysis of the structure of generic reinforcement learning environments' laying the foundation for potential quantum advantage with utility-scale quantum computers. Furthermore, we introduce the warm-start initialization variant (WS-VarQPI) that significantly reduces resource overhead. The algorithm solves a large FrozenLake environment with an underlying 256×256-dimensional linear system, indicating its practical robustness."
