title = "Benchmarking Online Sequence-to-Sequence and Character-based Handwriting Recognition from IMU-enhanced Pens"
authors = ["Felix Ott", "David Rügamer", "Lucas Heublein", "Tim Hamann", "Jens Barth", "Bernd Bischl", "Christopher Mutschler"]
date = "2022-01-01"
venue = "International Journal on Document Analysis and Recognition (IJDAR)"
detail_url = "/publication/benchmarking-online-sequence-to-sequence-and-character-based-handwriting-recognition-from-imu-enhanced-pens/"
