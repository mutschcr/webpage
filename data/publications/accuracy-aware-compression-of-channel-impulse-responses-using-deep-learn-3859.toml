title = "Accuracy-Aware Compression of Channel Impulse Responses using Deep Learning"
authors = ["Thomas Altstidl", "Sebastian Kram", "Oskar Herrmann", "Maximilian Stahlke", "Tobias Feigl", "Christopher Mutschler"]
date = "2021-01-01"
venue = "11th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
detail_url = "/publication/accuracy-aware-compression-of-channel-impulse-responses-using-deep-learning/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN51156.2021.9662545"
abstract = "We evaluate multiple neural network architectures containing encoding (compressing) and decoding (reconstructing) components and compare them to the state-of-the-art compression techniques Discrete Cosine Transform (DCT) and Discrete Wavelet Transform (DWT). We show that fully connected autoencoders achieve the lowest error, outperforming both DCT and DWT. Further experiments prove that the reconstructed CSI can be used for positioning with only mild performance deterioration at a compression of >97% and even when trained on a different environment."
