title = "Reliable Speculative Processing of Out-of-Order Event Streams in Generic Publish/Subscribe Middlewares"
authors = ["Christopher Mutschler", "Michael Philippsen"]
date = "2013-01-01"
venue = "7th ACM International Conference on Distributed Event-Based Systems"
detail_url = "/publication/reliable-speculative-processing-of-out-of-order-event-streams-in-generic-publish-subscribe-middlewares/"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1145/2488222.2488263"
abstract = '''
This paper presents a speculative processing technique for out-of-order event streams that enhances typical buffering approaches. We use a buffering technique to delay events but also speculatively processes a portion of it, and adapt the degree of speculation at runtime to fit the available system resources so that detection latency becomes minimal.
Our technique outperforms known approaches on both synthetical data and real sensor data from a Realtime Locating System (RTLS) with several thousands of out-of-order sensor events per second. Speculative buffering exploits system resources and reduces latency by 40% on average.'''
